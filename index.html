<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作排程看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --panel: #111318;
    --border: #1e2230;
    --border-bright: #2a3050;
    --text: #dde2f0;
    --text-dim: #525a7a;
    --text-mid: #8891b0;
    --accent: #2e6fff;
    --accent-glow: rgba(46,111,255,0.15);
    --header-bg: #141829;
    --row-alt: rgba(255,255,255,0.018);
    --red-bg: rgba(220,50,50,0.12);
    --red-text: #ff5555;
    --red-border: rgba(220,50,50,0.35);
    --yellow-bg: rgba(220,170,30,0.10);
    --yellow-text: #f5c842;
    --yellow-border: rgba(220,170,30,0.30);
    --ok-color: #3de8a0;
    --done-color: #4a9eff;
    --cancel-color: #525a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    overflow: hidden;
  }

  /* Subtle grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(46,111,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,111,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh;
    padding: 20px 28px 16px;
    gap: 16px;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .brand {
    display: flex; align-items: baseline; gap: 12px;
  }
  .brand h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
  }
  .brand .sub {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .topbar-right {
    display: flex; align-items: center; gap: 20px;
  }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #fff;
    letter-spacing: 0.06em;
  }
  .date-label {
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok-color);
    box-shadow: 0 0 8px var(--ok-color);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.error { background: var(--red-text); box-shadow: 0 0 8px var(--red-text); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Summary chips */
  .summary {
    display: flex; gap: 10px; flex-shrink: 0;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.04em;
  }
  .chip .n {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
  }
  .chip.c-active .n { color: var(--ok-color); }
  .chip.c-warn .n { color: var(--yellow-text); }
  .chip.c-urgent .n { color: var(--red-text); }
  .chip.c-done .n { color: var(--done-color); }

  /* Table container — scrollable */
  .table-container {
    flex: 1;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  /* Fixed header */
  thead {
    flex-shrink: 0;
  }
  thead tr {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border-bright);
  }
  th {
    padding: 13px 18px;
    text-align: left;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
    white-space: nowrap;
    font-family: 'Oswald', sans-serif;
  }
  th:first-child { padding-left: 22px; }

  /* Scrollable body */
  .tbody-wrap {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
  }
  .tbody-wrap::-webkit-scrollbar { width: 4px; }
  .tbody-wrap::-webkit-scrollbar-track { background: transparent; }
  .tbody-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.2s;
    animation: fadeIn 0.4s ease both;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Row color variants */
  tbody tr.row-red {
    background: var(--red-bg) !important;
    border-left: 3px solid var(--red-border);
  }
  tbody tr.row-yellow {
    background: var(--yellow-bg) !important;
    border-left: 3px solid var(--yellow-border);
  }

  td {
    padding: 14px 18px;
    vertical-align: middle;
    line-height: 1.5;
  }
  td:first-child { padding-left: 22px; }

  .row-red td { color: var(--red-text); }
  .row-yellow td { color: var(--yellow-text); }

  .cell-main {
    font-weight: 500;
    font-size: 15px;
  }
  .cell-dim {
    color: var(--text-mid);
    font-size: 13px;
  }
  .row-red .cell-dim { color: rgba(255,85,85,0.7); }
  .row-yellow .cell-dim { color: rgba(245,200,66,0.7); }

  .cell-delivery {
    white-space: pre-line;
    font-size: 14px;
    line-height: 1.6;
  }

  /* Status badge */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-active {
    background: rgba(61,232,160,0.12);
    color: var(--ok-color);
    border: 1px solid rgba(61,232,160,0.25);
  }
  .badge-done {
    background: rgba(74,158,255,0.10);
    color: var(--done-color);
    border: 1px solid rgba(74,158,255,0.20);
  }
  .badge-cancel {
    background: rgba(82,90,122,0.15);
    color: var(--cancel-color);
    border: 1px solid rgba(82,90,122,0.25);
    text-decoration: line-through;
  }

  /* Footer */
  .footer {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    padding: 0 2px;
  }
  .next-update {
    display: flex; align-items: center; gap: 6px;
  }
  .progress-bar {
    width: 80px; height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 1s linear;
  }

  /* Empty / error state */
  .state-msg {
    padding: 60px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .state-msg .icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }

  /* Config overlay */
  .config-overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,16,0.92);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .config-box {
    background: var(--panel);
    border: 1px solid var(--border-bright);
    border-radius: 14px;
    padding: 36px 40px;
    width: 480px;
    max-width: 92vw;
  }
  .config-box h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    color: #fff;
  }
  .config-box p {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .config-box label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .config-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    border-radius: 7px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .config-box input:focus { outline: none; border-color: var(--accent); }
  .config-box .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: -10px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .btn-start {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }
  .btn-start:hover { opacity: 0.85; }
</style>
</head>
<body>

<!-- Config overlay (shown on first launch) -->
<div class="config-overlay" id="config-overlay">
  <div class="config-box">
    <h2>⚙ 設定 Google Sheets</h2>
    <p>請輸入你的 Google Sheets ID，程式會每 30 秒自動讀取並更新表格。</p>
    <label>Google Sheets ID</label>
    <input type="text" id="sheet-id-input" placeholder="例：1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
    <div class="hint">
      從 Sheets 網址複製：<br>
      https://docs.google.com/spreadsheets/d/<strong style="color:var(--accent)">這段就是 ID</strong>/edit
    </div>
    <label>工作表名稱（預設 Sheet1）</label>
    <input type="text" id="sheet-name-input" placeholder="Sheet1">
    <button class="btn-start" onclick="startDisplay()">開始顯示</button>
  </div>
</div>

<!-- Main display -->
<div class="wrapper" id="main-display" style="display:none">
  <div class="topbar">
    <div class="brand">
      <h1>工作排程看板</h1>
      <span class="sub" id="sheet-label">—</span>
    </div>
    <div class="topbar-right">
      <div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-label" id="date-label">—</div>
      </div>
      <div class="status-dot" id="status-dot"></div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>客戶名稱</th>
          <th>工作項目</th>
          <th>發包日期</th>
          <th>寄(交)貨日期</th>
          <th>執行人</th>
          <th>申請單日期</th>
          <th>狀態</th>
        </tr>
      </thead>
    </table>
    <div class="tbody-wrap" id="tbody-wrap">
      <table style="width:100%">
        <tbody id="tbody"></tbody>
      </table>
      <div class="state-msg" id="state-msg" style="display:none">
        <div class="icon">📋</div>
        <div id="state-text">載入中...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>按 <kbd style="background:var(--border);padding:1px 5px;border-radius:3px">S</kbd> 重新設定 Sheets ID</div>
    <div class="next-update">
      下次更新
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:100%"></div></div>
      <span id="countdown">30s</span>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tv_sheet_config';
const REFRESH_SEC = 30;

let sheetId = '';
let sheetName = 'Sheet1';
let countdown = REFRESH_SEC;
let timer = null;
let progressTimer = null;

// ── Init ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  startDisplay(true);
});

document.addEventListener('keydown', e => {
  if (e.key === 's' || e.key === 'S') showConfig();
});

function showConfig() {
  document.getElementById('sheet-id-input').value = sheetId;
  document.getElementById('sheet-name-input').value = sheetName;
  document.getElementById('config-overlay').style.display = 'flex';
  document.getElementById('main-display').style.display = 'none';
  clearInterval(timer);
  clearInterval(progressTimer);
}

function startDisplay(fromSaved = false) {
  if (!fromSaved) {
    sheetId = document.getElementById('sheet-id-input').value.trim();
    sheetName = document.getElementById('sheet-name-input').value.trim() || 'Sheet1';
    if (!sheetId) { alert('請輸入 Sheets ID'); return; }
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ id: sheetId, name: sheetName }));
  }
  document.getElementById('config-overlay').style.display = 'none';
  document.getElementById('main-display').style.display = 'flex';
  document.getElementById('sheet-label').textContent = sheetName;

  startClock();
  fetchData();
  startRefreshCycle();
}

// ── Clock ─────────────────────────────────────────────
function startClock() {
  const weekdays = ['日','一','二','三','四','五','六'];
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    document.getElementById('date-label').textContent =
      `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} （${weekdays[now.getDay()]}）`;
  }
  tick();
  setInterval(tick, 1000);
}

// ── Refresh cycle ─────────────────────────────────────
function startRefreshCycle() {
  clearInterval(timer);
  clearInterval(progressTimer);

  countdown = REFRESH_SEC;
  updateCountdown();

  progressTimer = setInterval(() => {
    countdown--;
    updateCountdown();
    if (countdown <= 0) {
      countdown = REFRESH_SEC;
      fetchData();
    }
  }, 1000);
}

function updateCountdown() {
  document.getElementById('countdown').textContent = `${countdown}s`;
  const pct = (countdown / REFRESH_SEC) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Fetch Google Sheets CSV ───────────────────────────
const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKu2qMbeRi8T9TAB0NMJnQGzjvOihaK1O3k6q0Ie86p5tg5h7RgB64wCZs78Cd2MkI-2PDbt45h3a4/pub?output=csv';

async function fetchData() {
  const dot = document.getElementById('status-dot');
  try {
    const res = await fetch(PUB_CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    dot.className = 'status-dot';
    renderTable(rows);
  } catch (e) {
    dot.className = 'status-dot error';
    showMsg('⚠ 無法讀取資料，請確認網路連線');
    console.error(e);
  }
}

// ── CSV parser ────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (let i = 1; i < lines.length; i++) { // skip header row
    const line = lines[i].trim();
    if (!line) continue;
    const cols = splitCSVLine(line);
    if (cols.every(c => !c.trim())) continue;
    rows.push(cols);
  }
  return rows;
}

function splitCSVLine(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      cols.push(cur.trim()); cur = '';
    } else {
      cur += ch;
    }
  }
  cols.push(cur.trim());
  return cols;
}

// ── Render ────────────────────────────────────────────
// Columns: 0=客戶 1=工作項目 2=發包日期 3=寄交貨 4=執行人 5=申請單日期 6=狀態 7=標記

function renderTable(rows) {
  const tbody = document.getElementById('tbody');
  const stateEl = document.getElementById('state-msg');

  if (!rows.length) { showMsg('尚無資料'); return; }

  stateEl.style.display = 'none';

  let activeCount = 0, warnCount = 0, urgentCount = 0, doneCount = 0;

  tbody.innerHTML = rows.map((cols, i) => {
    const client   = cols[0] || '';
    const item     = cols[1] || '';
    const packDate = cols[2] || '';
    const delivery = cols[3] || '';
    const executor = cols[4] || '';
    const reqDate  = cols[5] || '';
    const status   = (cols[6] || '').trim();
    const mark     = (cols[7] || '').trim().toLowerCase();

    let rowClass = '';
    if (mark === 'red') { rowClass = 'row-red'; urgentCount++; }
    else if (mark === 'yellow') { rowClass = 'row-yellow'; warnCount++; }
    else if (status === '完成') doneCount++;
    else activeCount++;

    const badgeHtml = renderBadge(status);

    return `<tr class="${rowClass}" style="animation-delay:${i * 0.04}s">
      <td class="cell-dim">${i + 1}</td>
      <td class="cell-main">${esc(client)}</td>
      <td class="cell-main">${esc(item)}</td>
      <td class="cell-dim">${esc(packDate)}</td>
      <td class="cell-delivery">${esc(delivery)}</td>
      <td class="cell-dim">${esc(executor)}</td>
      <td class="cell-dim">${esc(reqDate)}</td>
      <td>${badgeHtml}</td>
    </tr>`;
  }).join('');

  // Summary
  document.getElementById('summary').innerHTML = `
    <div class="chip">總計 <span class="n" style="color:var(--text)">${rows.length}</span> 筆</div>
    <div class="chip c-active">進行中 <span class="n">${activeCount}</span></div>
    <div class="chip c-warn">注意 <span class="n">${warnCount}</span></div>
    <div class="chip c-urgent">緊急 <span class="n">${urgentCount}</span></div>
    <div class="chip c-done">完成 <span class="n">${doneCount}</span></div>
  `;
}

function renderBadge(status) {
  if (!status) return '';
  const s = status.trim();
  if (s === '完成') return `<span class="badge badge-done">完成</span>`;
  if (s === '取消') return `<span class="badge badge-cancel">取消</span>`;
  return `<span class="badge badge-active">${esc(s) || '進行中'}</span>`;
}

function showMsg(text) {
  const stateEl = document.getElementById('state-msg');
  document.getElementById('state-text').textContent = text;
  stateEl.style.display = 'block';
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('summary').innerHTML = '';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
