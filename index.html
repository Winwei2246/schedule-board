<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作排程看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --panel: #111318; --border: #1e2230; --border-bright: #2a3050;
    --text: #dde2f0; --text-dim: #525a7a; --text-mid: #8891b0; --accent: #2e6fff;
    --header-bg: #141829; --row-alt: rgba(255,255,255,0.018);
    --red-bg: rgba(220,50,50,0.12); --red-text: #ff5555; --red-border: rgba(220,50,50,0.35);
    --yellow-bg: rgba(220,170,30,0.10); --yellow-text: #f5c842; --yellow-border: rgba(220,170,30,0.30);
    --ok-color: #3de8a0; --done-color: #4a9eff; --cancel-color: #525a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(46,111,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(46,111,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; padding: 20px 28px 16px; gap: 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }
  .brand .sub { font-size: 12px; color: var(--text-dim); letter-spacing: 0.06em; }
  .topbar-right { display: flex; align-items: center; gap: 20px; }
  .clock { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 400; color: #fff; letter-spacing: 0.06em; }
  .date-label { font-size: 12px; color: var(--text-dim); text-align: right; letter-spacing: 0.05em; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-color); box-shadow: 0 0 8px var(--ok-color); animation: pulse 2s ease-in-out infinite; }
  .status-dot.error { background: var(--red-text); box-shadow: 0 0 8px var(--red-text); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .summary { display: flex; gap: 10px; flex-shrink: 0; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 16px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; letter-spacing: 0.04em; }
  .chip .n { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 400; line-height: 1; }
  .chip.c-active .n { color: var(--ok-color); }
  .chip.c-warn .n { color: var(--yellow-text); }
  .chip.c-urgent .n { color: var(--red-text); }
  .chip.c-done .n { color: var(--done-color); }
  .table-container { flex: 1; overflow: hidden; background: var(--panel); border: 1px solid var(--border-bright); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead tr { background: var(--header-bg); border-bottom: 1px solid var(--border-bright); }
  th { padding: 13px 18px; text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); font-weight: 500; white-space: nowrap; font-family: 'Oswald', sans-serif; }
  th:first-child { padding-left: 22px; }
  .tbody-wrap { flex: 1; overflow: hidden; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr.row-red { background: var(--red-bg) !important; border-left: 3px solid var(--red-border); }
  tbody tr.row-yellow { background: var(--yellow-bg) !important; border-left: 3px solid var(--yellow-border); }
  td { padding: 14px 18px; vertical-align: middle; line-height: 1.5; }
  td:first-child { padding-left: 22px; }
  .row-red td { color: var(--red-text); }
  .row-yellow td { color: var(--yellow-text); }
  .cell-main { font-weight: 500; font-size: 15px; }
  .cell-dim { color: var(--text-mid); font-size: 13px; }
  /* 交貨日期警示 */
  .delivery-urgent { color: var(--red-text) !important; font-weight: 600; }
  .delivery-warn { color: var(--yellow-text) !important; font-weight: 600; }
  .delivery-overdue { color: var(--red-text) !important; font-weight: 600; opacity: 0.7; text-decoration: line-through; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; letter-spacing: 0.06em; font-weight: 500; white-space: nowrap; }
  .badge-active { background: rgba(61,232,160,0.12); color: var(--ok-color); border: 1px solid rgba(61,232,160,0.25); }
  .badge-done { background: rgba(74,158,255,0.10); color: var(--done-color); border: 1px solid rgba(74,158,255,0.20); }
  .badge-cancel { background: rgba(82,90,122,0.15); color: var(--cancel-color); border: 1px solid rgba(82,90,122,0.25); text-decoration: line-through; }
  .page-dots { display: flex; gap: 6px; align-items: center; }
  .page-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-bright); transition: all 0.3s; }
  .page-dot.active { background: var(--accent); width: 18px; border-radius: 3px; }
  .footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; padding: 0 2px; }
  .progress-bar { width: 80px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 1s linear; }
  .page-timer-bar { width: 60px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .page-timer-fill { height: 100%; background: var(--ok-color); border-radius: 1px; transition: width 1s linear; }
  .state-msg { padding: 60px 0; text-align: center; color: var(--text-dim); font-size: 14px; }
  .state-msg .icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .page-animate tr { animation: pageIn 0.3s ease both; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="brand">
      <h1>工作排程看板</h1>
      <span class="sub">工作表1</span>
    </div>
    <div class="topbar-right">
      <div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-label" id="date-label">—</div>
      </div>
      <div class="status-dot" id="status-dot"></div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>客戶名稱</th>
          <th>工作項目</th>
          <th>發包日期</th>
          <th>寄(交)貨日期</th>
          <th>執行人</th>
          <th>申請單日期</th>
          <th>狀態</th>
        </tr>
      </thead>
    </table>
    <div class="tbody-wrap">
      <table style="width:100%">
        <tbody id="tbody"></tbody>
      </table>
      <div class="state-msg" id="state-msg">
        <div class="icon">📋</div>
        <div id="state-text">載入中...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div style="display:flex;align-items:center;gap:12px;">
      陸格發包大圖工作表
      <div class="page-dots" id="page-dots"></div>
      <span id="page-label" style="font-size:11px;color:var(--text-dim)"></span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:6px;">
        換頁
        <div class="page-timer-bar"><div class="page-timer-fill" id="page-timer-fill" style="width:100%"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        更新
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:100%"></div></div>
        <span id="countdown">2m</span>
      </div>
    </div>
  </div>
</div>

<script>
const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRKu2qMbeRi8T9TAB0NMJnQGzjvOihaK1O3k6q0le86p5tg5h7RgB64wCZs78Cd2MkI-2PDbt45h3a4/pub?gid=0&single=true&output=csv';
const REFRESH_SEC = 120;
const PAGE_SEC    = 10;
const PAGE_SIZE   = 15;

let countdown  = REFRESH_SEC;
let pageSec    = PAGE_SEC;
let lastData   = null;
let allRows    = [];
let currentPage = 0;
let totalPages  = 1;

window.addEventListener('DOMContentLoaded', () => {
  startClock();
  fetchData();
  startRefreshCycle();
  startPageCycle();
});

// ── 時鐘 ─────────────────────────────────────
function startClock() {
  const wd = ['日','一','二','三','四','五','六'];
  function tick() {
    const n = new Date();
    document.getElementById('clock').textContent =
      [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2,'0')).join(':');
    document.getElementById('date-label').textContent =
      `${n.getFullYear()}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')} （${wd[n.getDay()]}）`;
  }
  tick(); setInterval(tick, 1000);
}

// ── 資料更新倒數 ──────────────────────────────
function startRefreshCycle() {
  countdown = REFRESH_SEC;
  setInterval(() => {
    countdown--;
    const m = Math.floor(countdown / 60), s = countdown % 60;
    document.getElementById('countdown').textContent = m > 0 ? `${m}m${s > 0 ? s+'s':''}` : `${s}s`;
    document.getElementById('progress-fill').style.width = (countdown / REFRESH_SEC * 100) + '%';
    if (countdown <= 0) { countdown = REFRESH_SEC; fetchData(); }
  }, 1000);
}

// ── 換頁倒數 ──────────────────────────────────
function startPageCycle() {
  pageSec = PAGE_SEC;
  setInterval(() => {
    pageSec--;
    document.getElementById('page-timer-fill').style.width = (pageSec / PAGE_SEC * 100) + '%';
    if (pageSec <= 0) {
      pageSec = PAGE_SEC;
      if (totalPages > 1) { currentPage = (currentPage + 1) % totalPages; renderPage(); }
    }
  }, 1000);
}

// ── 解析日期字串（支援 2026/03/15 或 2026/03/15 PM3:00 等）──
function parseDate(str) {
  if (!str) return null;
  // 只取日期部分（空格前）
  const datePart = str.trim().split(' ')[0];
  // 支援 2026/03/15 或 2026-03-15
  const parts = datePart.split(/[\/\-]/);
  if (parts.length < 3) return null;
  const y = parseInt(parts[0]), m = parseInt(parts[1]) - 1, d = parseInt(parts[2]);
  if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
  return new Date(y, m, d);
}

// ── 今天的午夜（00:00:00）──
function today() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

// ── 判斷列的顏色等級 ──
// 回傳 'red' | 'yellow' | ''
function getRowMark(cols) {
  const manualMark = (cols[7] || '').trim().toLowerCase();
  if (manualMark === 'red') return 'red';
  if (manualMark === 'yellow') return 'yellow';

  // 自動判斷：只看狀態不是「完成」或「取消」的列
  const status = (cols[6] || '').trim();
  if (status === '完成' || status === '取消') return '';

  const deliveryDate = parseDate(cols[3]);
  if (!deliveryDate) return '';

  const t = today();
  const diffDays = Math.round((deliveryDate - t) / (1000 * 60 * 60 * 24));

  if (diffDays <= 0) return 'red';    // 當天或已過期
  if (diffDays === 1) return 'yellow'; // 明天到期（前一天）
  return '';
}

// ── Fetch 資料 ────────────────────────────────
async function fetchData() {
  const dot = document.getElementById('status-dot');
  try {
    const res = await fetch(PUB_CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length === 0) throw new Error('empty');

    // 排序：依D欄（寄交貨日期）由近到遠，無日期排最後
    rows.sort((a, b) => {
      const da = parseDate(a[3]), db = parseDate(b[3]);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });

    lastData = rows;
    allRows = rows;
    totalPages = Math.ceil(allRows.length / PAGE_SIZE);
    currentPage = 0;
    dot.className = 'status-dot';
    updateSummary(rows);
    updateDots();
    renderPage();
  } catch(e) {
    dot.className = 'status-dot error';
    if (lastData) { allRows = lastData; renderPage(); }
    else showMsg('⚠ 無法讀取資料，請確認試算表已公開分享');
    console.error(e);
  }
}

// ── 渲染當前頁 ────────────────────────────────
function renderPage() {
  if (!allRows.length) { showMsg('尚無資料'); return; }
  document.getElementById('state-msg').style.display = 'none';

  const start = currentPage * PAGE_SIZE;
  const pageRows = allRows.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('tbody');
  tbody.className = 'page-animate';

  tbody.innerHTML = pageRows.map((cols, i) => {
    const globalIdx = start + i;
    const client   = cols[0] || '';
    const item     = cols[1] || '';
    const packDate = cols[2] || '';
    const delivery = cols[3] || '';
    const executor = cols[4] || '';
    const reqDate  = cols[5] || '';
    const status   = (cols[6] || '').trim();
    const mark     = getRowMark(cols);

    const rowClass = mark === 'red' ? 'row-red' : mark === 'yellow' ? 'row-yellow' : '';

    // 判斷交貨日期欄的顏色 class
    let deliveryClass = 'cell-dim';
    if (mark === 'red')    deliveryClass = 'delivery-urgent';
    else if (mark === 'yellow') deliveryClass = 'delivery-warn';

    // 已過期加刪除線
    const deliveryDate = parseDate(delivery);
    if (deliveryDate && deliveryDate < today() && !['完成','取消'].includes(status)) {
      deliveryClass = 'delivery-overdue';
    }

    return `<tr class="${rowClass}" style="animation-delay:${i*0.03}s">
      <td class="cell-dim">${globalIdx + 1}</td>
      <td class="cell-main">${esc(client)}</td>
      <td class="cell-main">${esc(item)}</td>
      <td class="cell-dim">${esc(packDate)}</td>
      <td class="${deliveryClass}">${esc(delivery)}</td>
      <td class="cell-dim">${esc(executor)}</td>
      <td class="cell-dim">${esc(reqDate)}</td>
      <td>${badge(status)}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-label').textContent =
    totalPages > 1 ? `${currentPage + 1} / ${totalPages}` : '';
  updateDots();
}

// ── 分頁圓點 ──────────────────────────────────
function updateDots() {
  const container = document.getElementById('page-dots');
  if (totalPages <= 1) { container.innerHTML = ''; return; }
  container.innerHTML = Array.from({length: totalPages}, (_, i) =>
    `<div class="page-dot ${i === currentPage ? 'active' : ''}"></div>`
  ).join('');
}

// ── 統計 chips ────────────────────────────────
function updateSummary(rows) {
  let a = 0, w = 0, u = 0, d = 0;
  rows.forEach(cols => {
    const status = (cols[6] || '').trim();
    const mark = getRowMark(cols);
    if (status === '完成') d++;
    else if (status === '取消') {}
    else if (mark === 'red') u++;
    else if (mark === 'yellow') w++;
    else a++;
  });
  document.getElementById('summary').innerHTML =
    `<div class="chip">總計 <span class="n" style="color:var(--text)">${rows.length}</span> 筆</div>
     <div class="chip c-active">進行中 <span class="n">${a}</span></div>
     <div class="chip c-warn">注意 <span class="n">${w}</span></div>
     <div class="chip c-urgent">緊急 <span class="n">${u}</span></div>
     <div class="chip c-done">完成 <span class="n">${d}</span></div>`;
}

// ── CSV 解析 ──────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = splitCSVLine(line);
    if (cols.every(c => !c.trim())) continue;
    rows.push(cols);
  }
  return rows;
}

function splitCSVLine(line) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cols.push(cur.trim());
  return cols;
}

function badge(s) {
  if (!s) return '';
  if (s === '完成') return '<span class="badge badge-done">完成</span>';
  if (s === '取消') return '<span class="badge badge-cancel">取消</span>';
  return `<span class="badge badge-active">${esc(s) || '進行中'}</span>`;
}

function showMsg(text) {
  document.getElementById('state-text').textContent = text;
  document.getElementById('state-msg').style.display = 'block';
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('summary').innerHTML = '';
}

function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}
</script>
</body>
</html>
