<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>工作排程看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
<style>
  :root {
    /* ── 背景 ── */
    --bg: #8794ac;                        /* 整頁背景 */
    --panel: #ffffff;                     /* 表格背景 */
    --header-bg: #8092e3;                 /* 表頭背景 */
    --row-alt: rgb(223, 213, 213);   /* 偶數行微亮 */
  
    /* ── 邊框 ── */
    --border: #6a6c73;                    /* 一般邊框 */
    --border-bright: #4e4f53;             /* 亮邊框 */
  
    /* ── 文字 ── */
    --text: #000000;                      /* 主要文字（客戶、工作項目）*/
    --text-dim: #000000;                  /* 最暗文字（編號、日期、執行人）← 看不清改這個 */
    --text-mid: #37393f;                  /* 中等文字（備注、交貨日期）← 偏暗改這個 */
    --accent: #2e6fff;                    /* 強調色（進度條、換頁點）*/
  
    /* ── 紅色列（今天到期）── */
    --red-bg: rgba(255, 0, 0, 0.12);       /* 背景 */
    --red-text: #000000;                  /* 文字 */
    --red-border: rgba(220,50,50,0.35);   /* 左邊線 */
  
    /* ── 黃色列（明天到期）── */
    --yellow-bg: rgba(249, 230, 177, 0.9);   /* 背景 */
    --yellow-text: #000000;               /* 文字 */
    --yellow-border: rgba(220,170,30,0.30); /* 左邊線 */
  
    /* ── 狀態色 ── */
    --ok-color: #3de8a0;                  /* 進行中 */
    --done-color: #4a9eff;                /* 完成 */
    --cancel-color: #525a7a;              /* 取消 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(46,111,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(46,111,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; padding: 6px 12px 4px; gap: 4px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; height: 72px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; }
  .brand .sub { font-size: 12px; color: var(--text-dim); letter-spacing: 0.06em; }
  .topbar-right { display: flex; align-items: center; gap: 24px; }

  /* 天氣區塊 */
  .weather-block { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-bright); border-radius: 8px; padding: 8px 14px; }
  .weather-icon { font-size: 28px; line-height: 1; color: #f5c842; }
  .weather-info { display: flex; flex-direction: column; align-items: flex-start; }
  .weather-temp { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 400; color: #fff; line-height: 1; }
  .weather-desc { font-size: 11px; color: var(--text-mid); margin-top: 2px; letter-spacing: 0.04em; }
  .weather-loc { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

  /* 時鐘區塊 */
  .clock-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .clock { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 400; color: #fff; letter-spacing: 0.06em; }
  .date-label { font-size: 12px; color: var(--text-dim); text-align: right; letter-spacing: 0.05em; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-color); box-shadow: 0 0 8px var(--ok-color); animation: pulse 2s ease-in-out infinite; flex-shrink: 0; }
  .status-dot.error { background: var(--red-text); box-shadow: 0 0 8px var(--red-text); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .summary { display: flex; gap: 8px; flex-shrink: 0; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; letter-spacing: 0.04em; }
  .chip .n { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 400; line-height: 1; }
  .chip.c-active .n { color: var(--ok-color); }
  .chip.c-warn .n { color: var(--yellow-text); }
  .chip.c-urgent .n { color: var(--red-text); }
  .chip.c-done .n { color: var(--done-color); }
  .table-container { flex: 1; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--border-bright); border-radius: 10px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--font-main, 15px); table-layout: fixed; }
  thead tr { background: var(--header-bg); border-bottom: 1px solid var(--border-bright); }
  thead { position: sticky; top: 0; z-index: 2; }
  th { padding: var(--th-pad, 10px 8px); text-align: left; font-size: var(--font-header, 11px); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); font-weight: 500; white-space: nowrap; font-family: 'Oswald', sans-serif; }
  th:first-child { padding-left: 10px; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.2s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr.row-red { background: var(--red-bg) !important; border-left: 3px solid var(--red-border); }
  tbody tr.row-overdue { background: rgba(80,80,90,0.18) !important; border-left: 3px solid rgba(120,120,140,0.4); }
  tbody tr.row-overdue td { color: #8891b0; }
  tbody tr.row-yellow { background: var(--yellow-bg) !important; border-left: 3px solid var(--yellow-border); }
  td { padding: var(--td-pad, 10px 8px); vertical-align: middle; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td:first-child { padding-left: 10px; }
  .row-red td { color: var(--red-text); }
  .row-yellow td { color: var(--yellow-text); }
  .cell-main { font-weight: 500; font-size: var(--font-main, 15px); }
  .cell-dim { color: var(--text-mid); font-size: var(--font-sub, 13px); }
  .cell-note { color: var(--text-mid); font-size: var(--font-sub, 13px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .delivery-tag { display: inline-block; font-size: var(--font-tag, 10px); padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
  .tag-overdue  { background: rgba(100,100,120,0.3); color: #8891b0; }
  .tag-today    { background: rgba(220,50,50,0.25); color: #fc1919; }
  .tag-tomorrow { background: rgba(220,170,30,0.25); color: #66531b; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; letter-spacing: 0.06em; font-weight: 500; white-space: nowrap; }
  .badge-active { background: rgba(61,232,160,0.12); color: var(--ok-color); border: 1px solid rgba(61,232,160,0.25); }
  .badge-done   { background: rgba(74,158,255,0.10); color: var(--done-color); border: 1px solid rgba(74,158,255,0.20); }
  .badge-cancel { background: rgba(82,90,122,0.15); color: var(--cancel-color); border: 1px solid rgba(82,90,122,0.25); text-decoration: line-through; }
  /* 新聞跑馬燈 */
  /* 新聞中間區塊 */
  .news-center { flex: 1; min-width: 0; margin: 0 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: center; }
  .news-badge { font-size: 10px; color: var(--accent); letter-spacing: 0.12em; font-family: 'Oswald', sans-serif; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .news-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.5s ease-in-out infinite; display: inline-block; }
  .news-slot { overflow: hidden; height: 36px; position: relative; }
  .news-title { font-size: 20px; font-weight: 500; color: #fff; letter-spacing: 0.02em; line-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: absolute; width: 100%; top: 0; transition: transform 0.5s ease, opacity 0.5s ease; }
  .news-title.hidden-below { transform: translateY(36px);  opacity: 0; pointer-events: none; }
  .news-title.hidden-above { transform: translateY(-36px); opacity: 0; pointer-events: none; }
  .news-title.visible      { transform: translateY(0);     opacity: 1; }
  .news-dots { display: flex; gap: 4px; margin-top: 5px; }
  .news-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border-bright); transition: background 0.3s; }
  .news-dot.active { background: var(--accent); }
  .page-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-bright); transition: all 0.3s; }
  .page-dot.active { background: var(--accent); width: 18px; border-radius: 3px; }
  .footer { flex-shrink: 0; display: flex; align-items: center; font-size: 13px; color: var(--text-dim); letter-spacing: 0.05em; padding: 4px 8px; height: 32px; gap: 16px; }
  .footer-left { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
  .footer-datetime { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--text); letter-spacing: 0.04em; }
  .footer-weather { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .footer-weather .wi { font-size: 16px; }
  .footer-weather-text { font-size: 13px; color: var(--text); }
  .footer-news { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.2); border-radius: 4px; padding: 2px 8px; }
  .footer-news-label { font-size: 10px; color: var(--accent); font-family: 'Oswald', sans-serif; letter-spacing: 0.08em; white-space: nowrap; flex-shrink: 0; }
  .footer-news-marquee { flex: 1; overflow: hidden; white-space: nowrap; }
  .footer-news-marquee span { display: inline-block; animation: marquee 30s linear infinite; font-size: 13px; color: var(--text-mid); }
  @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  .footer-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .progress-bar { width: 80px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 1px; transition: width 1s linear; }
  .page-timer-bar { width: 60px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .page-timer-fill { height: 100%; background: var(--ok-color); border-radius: 1px; transition: width 1s linear; }
  .state-msg { padding: 60px 0; text-align: center; color: var(--text-dim); font-size: 14px; }
  .state-msg .icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .page-animate tr { animation: pageIn 0.3s ease both; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="table-container">
    <table id="main-table">
      <thead>
        <tr>
          <th id="th-client">客戶</th>
          <th>工作項目</th>
          <th id="th-delivery">寄(交)貨日期</th>
          <th id="th-executor">執行</th>
          <th id="th-note">備注</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="state-msg" id="state-msg">
      <div class="icon">📋</div>
      <div id="state-text">載入中...</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <span class="footer-datetime" id="footer-datetime">--/--（-）--:--</span>
    </div>
    <div class="footer-weather">
      <i class="wi wi-na" id="footer-weather-icon"></i>
      <span class="footer-weather-text" id="footer-weather-text">--°C</span>
    </div>
    <div class="footer-news">
      <span class="footer-news-label">即時新聞</span>
      <div class="footer-news-marquee"><span id="footer-news-text"></span></div>
    </div>
    <div class="footer-right">
      <div class="page-dots" id="page-dots"></div>
      <span id="page-label" style="font-size:11px;color:var(--text-dim)"></span>
      <div style="display:flex;align-items:center;gap:4px;">
        換頁
        <div class="page-timer-bar"><div class="page-timer-fill" id="page-timer-fill" style="width:100%"></div></div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        更新
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:100%"></div></div>
        <span id="countdown">2m</span>
      </div>
    </div>
  </div>
</div>

<script>
const PUB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT2SvTt9UhNXgMOG2ZapZB4H4j7kvjHxOGbGkAvVvbipbYD3L1B52xmf0jGpbZ1-7D12pqLhzbxcph1/pub?gid=0&single=true&output=csv';
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=24.9934&longitude=121.5020&current=temperature_2m,weathercode,is_day&timezone=Asia/Taipei';
const NEWS_RSS = 'https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/zhongwen/trad/rss.xml';
const REFRESH_SEC = 120;
const PAGE_SEC = 30;
const PAGE_SIZE = 10;
const OVERDUE_HIDE_DAYS = 3;  // 逾期超過幾天自動隱藏（0 = 逾期當天就隱藏）

// ── 欄位寬度設定（px）─────────────────────────
// 只改數字即可，工作項目自動填滿剩餘空間
// 目前合計 = 85 + 260 + 52 + 210 = 607px
// 螢幕 1920px − 607px = 約 1313px 給工作項目
const COL_WIDTH = {
  client:   90,   // 客戶名稱
  delivery: 200,  // 寄(交)貨日期
  executor: 52,   // 執行人
  note:     220,  // 備注
};

// ── 行高設定（px）────────────────────────────
const ROW_HEIGHT = {
  thPadY:   10,   // 表頭上下內距，加大→表頭變高
  thPadX:   8,    // 表頭左右內距
  tdPadY:   10.6,   // 資料列上下內距，加大→每行變高
  tdPadX:   8,    // 資料列左右內距
};

// ── 字體大小設定（px）────────────────────────
const FONT_SIZE = {
  main:     22,   // 客戶名稱、工作項目
  sub:      18,   // 編號、日期、執行人、備注
  header:   11,   // 表頭標題
  tag:      10,   // 今天到期、已逾期 等標籤
};

// 欄位索引
const COL = { client:0, item:1, packDate:2, delivery:3, deliveryTime:4, executor:5, reqDate:6, status:7, mark:8 };

let countdown = REFRESH_SEC, pageSec = PAGE_SEC;
let lastData = null, allRows = [], currentPage = 0, totalPages = 1;

window.addEventListener('DOMContentLoaded', () => {
  // 套用欄位寬度
  document.getElementById('th-client').style.width = COL_WIDTH.client + 'px';
  document.getElementById('th-delivery').style.width = COL_WIDTH.delivery + 'px';
  document.getElementById('th-executor').style.width = COL_WIDTH.executor + 'px';
  document.getElementById('th-note').style.width = COL_WIDTH.note + 'px';

  // 套用行高與字體大小
  const s = document.documentElement.style;
  s.setProperty('--th-pad', ROW_HEIGHT.thPadY + 'px ' + ROW_HEIGHT.thPadX + 'px');
  s.setProperty('--td-pad', ROW_HEIGHT.tdPadY + 'px ' + ROW_HEIGHT.tdPadX + 'px');
  s.setProperty('--font-main', FONT_SIZE.main + 'px');
  s.setProperty('--font-sub', FONT_SIZE.sub + 'px');
  s.setProperty('--font-header', FONT_SIZE.header + 'px');
  s.setProperty('--font-tag', FONT_SIZE.tag + 'px');

  fetchData();
  startRefreshCycle();
  startPageCycle();
  startFooterClock();
  fetchWeather();
  fetchNews();
  setInterval(fetchWeather, 30 * 60 * 1000);
  setInterval(fetchNews, 15 * 60 * 1000);
  // 每天凌晨 3 點自動重整，確保拿到最新版本
  setInterval(() => {
    if (new Date().getHours() === 3) location.reload();
  }, 60 * 60 * 1000);
});

// ── 倒數計時 ──────────────────────────────────
function startRefreshCycle() {
  countdown = REFRESH_SEC;
  setInterval(() => {
    countdown--;
    const m = Math.floor(countdown/60), s = countdown%60;
    document.getElementById('countdown').textContent = m > 0 ? `${m}m${s>0?s+'s':''}` : `${s}s`;
    document.getElementById('progress-fill').style.width = (countdown/REFRESH_SEC*100)+'%';
    if (countdown <= 0) { countdown = REFRESH_SEC; fetchData(); }
  }, 1000);
}

function startPageCycle() {
  pageSec = PAGE_SEC;
  setInterval(() => {
    pageSec--;
    document.getElementById('page-timer-fill').style.width = (pageSec/PAGE_SEC*100)+'%';
    if (pageSec <= 0) {
      pageSec = PAGE_SEC;
      if (totalPages > 1) { currentPage = (currentPage+1) % totalPages; renderPage(); }
    }
  }, 1000);
}

// ── Footer 時鐘 ─────────────────────────────
function startFooterClock() {
  const wd = ['日','一','二','三','四','五','六'];
  function tick() {
    const n = new Date();
    const mm = String(n.getMonth()+1).padStart(2,'0');
    const dd = String(n.getDate()).padStart(2,'0');
    const hh = String(n.getHours()).padStart(2,'0');
    const mi = String(n.getMinutes()).padStart(2,'0');
    document.getElementById('footer-datetime').textContent =
      `${mm}/${dd}（${wd[n.getDay()]}）${hh}:${mi}`;
  }
  tick(); setInterval(tick, 1000);
}

// ── Footer 天氣 ─────────────────────────────
function weatherInfo(code, isDay) {
  const d = isDay ? 'day' : 'night';
  if (code === 0)  return { cls: `wi-${d}-sunny`,       desc: '晴天' };
  if (code <= 2)   return { cls: `wi-${d}-cloudy`,      desc: '多雲' };
  if (code === 3)  return { cls: 'wi-cloudy',            desc: '陰天' };
  if (code <= 49)  return { cls: `wi-${d}-fog`,         desc: '霧' };
  if (code <= 57)  return { cls: 'wi-sprinkle',          desc: '毛毛雨' };
  if (code <= 65)  return { cls: 'wi-rain',              desc: '雨天' };
  if (code <= 67)  return { cls: 'wi-rain-mix',          desc: '凍雨' };
  if (code <= 77)  return { cls: 'wi-snow',              desc: '雪' };
  if (code <= 82)  return { cls: 'wi-showers',           desc: '陣雨' };
  if (code <= 86)  return { cls: 'wi-snow',              desc: '陣雪' };
  if (code <= 99)  return { cls: 'wi-thunderstorm',      desc: '雷雨' };
  return { cls: 'wi-na', desc: '未知' };
}

async function fetchWeather() {
  try {
    const res = await fetch(WEATHER_URL);
    const data = await res.json();
    const cur = data.current;
    const info = weatherInfo(cur.weathercode, cur.is_day === 1);
    document.getElementById('footer-weather-icon').className = `wi ${info.cls}`;
    document.getElementById('footer-weather-text').textContent =
      `${Math.round(cur.temperature_2m)}°C ${info.desc}`;
  } catch(e) {
    document.getElementById('footer-weather-text').textContent = '--°C';
    console.error('weather error', e);
  }
}

// ── Footer 新聞跑馬燈 ───────────────────────
let newsTitles = [];
let newsIndex = 0;

async function fetchNews() {
  try {
    const res = await fetch(NEWS_RSS + '&t=' + Date.now());
    const data = await res.json();
    if (data.status !== 'ok' || !data.items?.length) return;
    newsTitles = data.items.slice(0, 10).map(i => i.title);
    newsIndex = 0;
    showNextNews();
    if (!window._newsTimer) {
      window._newsTimer = setInterval(showNextNews, 30000);
    }
  } catch(e) {
    console.error('news error', e);
  }
}

function showNextNews() {
  if (!newsTitles.length) return;
  const el = document.getElementById('footer-news-text');
  el.textContent = newsTitles[newsIndex];
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = '';
  newsIndex = (newsIndex + 1) % newsTitles.length;
}

// ── 日期工具 ─────────────────────────────────
function fmtMD(str) {
  if (!str || !str.trim()) return '';
  const m = str.trim().match(/^\d{4}[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return str;
  return `${parseInt(m[1])}/${parseInt(m[2])}`;
}

function parseDateOnly(str) {
  if (!str || !str.trim()) return null;
  const datePart = str.trim().split(' ')[0].replace(/-/g, '/');
  const d = new Date(datePart);
  if (isNaN(d.getTime())) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function parseTimeMinutes(str) {
  if (!str || !str.trim()) return 0;
  const s = str.trim().toUpperCase();
  const match = s.match(/^(AM|PM)(\d{1,2}):(\d{2})$/);
  if (!match) return 0;
  let h = parseInt(match[2]);
  const min = parseInt(match[3]);
  if (match[1] === 'PM' && h !== 12) h += 12;
  if (match[1] === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}

function today() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

function getRowColor(cols) {
  const mark = (cols[COL.mark]||'').trim().toLowerCase();
  if (mark === 'red') return 'red';
  if (mark === 'yellow') return 'yellow';
  const status = (cols[COL.status]||'').trim();
  if (status === '完成' || status === '取消') return '';
  const delivery = parseDateOnly(cols[COL.delivery]);
  if (!delivery) return '';
  const diff = Math.round((delivery - today()) / 86400000);
  if (diff < 0) return 'overdue';  // 已逾期 → 灰底
  if (diff === 0) return 'red';    // 今天到期 → 紅底
  if (diff === 1) return 'yellow';
  return '';
}

function deliveryTag(cols) {
  const mark = (cols[COL.mark]||'').trim().toLowerCase();
  if (mark === 'red' || mark === 'yellow') return '';
  const status = (cols[COL.status]||'').trim();
  if (status === '完成' || status === '取消') return '';
  const delivery = parseDateOnly(cols[COL.delivery]);
  if (!delivery) return '';
  const diff = Math.round((delivery - today()) / 86400000);
  if (diff < 0)   return '<span class="delivery-tag tag-overdue">已逾期</span>';
  if (diff === 0) return '<span class="delivery-tag tag-today">今天到期</span>';
  if (diff === 1) return '<span class="delivery-tag tag-tomorrow">明天到期</span>';
  return '';
}

function formatDelivery(cols) {
  const date = (cols[COL.delivery]||'').trim();
  const time = (cols[COL.deliveryTime]||'').trim();
  if (!date) return '';
  return time ? `${fmtMD(date)} ${time}` : fmtMD(date);
}

// ── Fetch 資料 ────────────────────────────────
async function fetchData() {
  try {
    const res = await fetch(PUB_CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length === 0) throw new Error('empty');
    rows.sort((a, b) => {
      const sa = (a[COL.status]||'').trim();
      const sb = (b[COL.status]||'').trim();
      const doneA = (sa === '完成' || sa === '取消') ? 1 : 0;
      const doneB = (sb === '完成' || sb === '取消') ? 1 : 0;
      if (doneA !== doneB) return doneA - doneB;
      const da = parseDateOnly(a[COL.delivery]);
      const db = parseDateOnly(b[COL.delivery]);
      const t = today();
      const overdueA = (da && da < t && !doneA) ? 1 : 0;
      const overdueB = (db && db < t && !doneB) ? 1 : 0;
      if (overdueA !== overdueB) return overdueA - overdueB;
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      if (da.getTime() !== db.getTime()) return da - db;
      return parseTimeMinutes(a[COL.deliveryTime]) - parseTimeMinutes(b[COL.deliveryTime]);
    });
    // 過濾：逾期超過 OVERDUE_HIDE_DAYS 天的不顯示
    const t = today();
    const filtered = rows.filter(cols => {
      const status = (cols[COL.status]||'').trim();
      if (status === '完成' || status === '取消') return true; // 完成/取消照常顯示
      const delivery = parseDateOnly(cols[COL.delivery]);
      if (!delivery) return true; // 沒有交貨日的照常顯示
      const diff = Math.round((delivery - t) / 86400000);
      return diff >= -OVERDUE_HIDE_DAYS; // 逾期超過天數的隱藏
    });
    lastData = rows; allRows = filtered;
    totalPages = Math.ceil(allRows.length / PAGE_SIZE);
    currentPage = 0;
    updateDots(); renderPage();
  } catch(e) {
    if (lastData) { allRows = lastData; renderPage(); }
    else showMsg('⚠ 無法讀取資料');
    console.error(e);
  }
}

// ── 渲染當前頁 ────────────────────────────────
function renderPage() {
  if (!allRows.length) { showMsg('尚無資料'); return; }
  document.getElementById('state-msg').style.display = 'none';
  const start = currentPage * PAGE_SIZE;
  const pageRows = allRows.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('tbody');
  tbody.className = 'page-animate';
  tbody.innerHTML = pageRows.map((cols, i) => {
    const color = getRowColor(cols);
    const rc = color === 'red' ? 'row-red' : color === 'yellow' ? 'row-yellow' : color === 'overdue' ? 'row-overdue' : '';
    return `<tr class="${rc}" style="animation-delay:${i*0.03}s">
      <td class="cell-main">${esc(cols[COL.client]||'')}</td>
      <td class="cell-main">${esc(cols[COL.item]||'')}</td>
      <td class="cell-dim">${esc(formatDelivery(cols))}${deliveryTag(cols)}</td>
      <td class="cell-dim">${esc(cols[COL.executor]||'')}</td>
      <td class="cell-note">${esc(cols[COL.reqDate]||'')}</td>
    </tr>`;
  }).join('');
  document.getElementById('page-label').textContent = totalPages > 1 ? `${currentPage+1} / ${totalPages}` : '';
  updateDots();
}

function updateDots() {
  const c = document.getElementById('page-dots');
  if (totalPages <= 1) { c.innerHTML = ''; return; }
  c.innerHTML = Array.from({length: totalPages}, (_,i) =>
    `<div class="page-dot ${i===currentPage?'active':''}"></div>`).join('');
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = splitCSVLine(line);
    if (cols.every(c => !c.trim())) continue;
    rows.push(cols);
  }
  return rows;
}

function splitCSVLine(line) {
  const cols=[]; let cur='', inQ=false;
  for (let i=0; i<line.length; i++) {
    const ch=line[i];
    if (ch==='"') { if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
    else if (ch===','&&!inQ) { cols.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  cols.push(cur.trim()); return cols;
}

function badge(s) {
  if (!s) return '';
  if (s==='完成') return '<span class="badge badge-done">完成</span>';
  if (s==='取消') return '<span class="badge badge-cancel">取消</span>';
  return `<span class="badge badge-active">${esc(s)||'進行中'}</span>`;
}

function showMsg(text) {
  document.getElementById('state-text').textContent = text;
  document.getElementById('state-msg').style.display = 'block';
  document.getElementById('tbody').innerHTML = '';
}

function esc(s) {
  return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}
</script>
